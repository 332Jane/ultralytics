# 碰撞检测管道 - 测试配置
# 使用标注点计算homography矩阵

video:
  path: "/workspace/ultralytics/videos/Homograph_Teset_FullScreen.mp4"
  description: "Homograph全屏测试视频 - 从标注点标定"
  fps: 30

yolo:
  model: "yolo11m"
  confidence_threshold: 0.45
  skip_frames: 3

homography:
  enabled: true
  
  # 使用标注点计算homography矩阵（而不是从文件加载）
  calibration_points:
    - name: "近处左上"
      pixel: [458, 135]
      world: [-1.75, 25.0]
    
    - name: "近处右上"
      pixel: [604, 135]
      world: [1.75, 25.0]
    
    - name: "远处左下"
      pixel: [225, 1535]
      world: [-1.75, 0.0]
    
    - name: "远处右下"
      pixel: [859, 1535]
      world: [1.75, 0.0]

collision:
  proximity_threshold_m: 4.5
  anchor_distance_threshold_m: 1.0
  vertex_shrink: 0.75

ttc_pet:
  ttc_thresholds:
    rear_end_serious: 2.8
    rear_end_general: 4.7
    sideswipe_serious: 2.3
    sideswipe_general: 4.2
  safety_margin_m: 1.5

output:
  save_yolo_detection: true
  save_keyframes: true
  generate_pdf: true
  save_json: true

report:
  max_events_in_report: 10
  include_filtered_events: true
  events_per_page_pdf: 3

advanced:
  min_track_length: 3
  track_gap_threshold: 4
  merge_same_frame_objects: true
  merge_distance_threshold_px: 100
