# Collision Detection Pipeline - Example Configuration File
# File: homograph_fullscreen_example.yaml
# Run command: cd /workspace/ultralytics && python examples/trajectory_demo/collision_detection_pipeline_yolo_first_method_a.py --config examples/trajectory_demo/configs/homograph_fullscreen_example.yaml

video:
  path: "/workspace/ultralytics/videos/Homograph_Teset_FullScreen.mp4"
  description: "HomographFullScreen Test Video"
  fps: 30

yolo:
  model: "yolo11m"                    # YOLO model variant (yolo11n, yolo11s, yolo11m, yolo11l, yolo11x)
  confidence_threshold: 0.45          # Detection confidence threshold (0.0-1.0, lower = more detections)
  skip_frames: 3                      # Process 1 out of every N frames (3 = process 1 every 3 frames for speed)

homography:
  enabled: true                       # Enable Homography transformation to world coordinates
  
  # Method 1: Use pre-computed Homography matrix file
  matrix_file: "/workspace/ultralytics/calibration/Homograph_Teset_FullScreen_homography.json"
  
  # Method 2: Compute from calibration points (alternative method)
  # If using calibration points, comment out matrix_file above and uncomment the following:
  # calibration_points:
  #   - name: "Near left corner"
  #     pixel: [100, 500]
  #     world: [0.5, 2.0]
  #   - name: "Near right corner"
  #     pixel: [1180, 500]
  #     world: [5.0, 2.0]
  #   - name: "Far left corner"
  #     pixel: [300, 200]
  #     world: [0.5, 10.0]
  #   - name: "Far right corner"
  #     pixel: [980, 200]
  #     world: [5.0, 10.0]

collision:
  proximity_threshold_m: 4.5          # Distance threshold for proximity events (meters)
  anchor_distance_threshold_m: 1.0    # Distance threshold for anchor point analysis (meters)
  vertex_shrink: 0.75                 # Shrink factor for vehicle bounding box vertices (0.0-1.0)

ttc_pet:
  ttc_thresholds:                     # Time-to-Collision (TTC) thresholds in seconds
    rear_end_serious: 2.8             # Serious rear-end collision threshold
    rear_end_general: 4.7             # General rear-end collision threshold
    sideswipe_serious: 2.3            # Serious side-swipe collision threshold
    sideswipe_general: 4.2            # General side-swipe collision threshold
  safety_margin_m: 1.5                # Safety margin for collision prediction (meters)

output:
  save_yolo_detection: true           # Save YOLO detection frames
  save_keyframes: true                # Save keyframe images with collision events
  generate_pdf: true                  # Generate PDF report
  save_json: true                     # Save JSON data files

report:
  max_events_in_report: 10            # Maximum number of events to include in text report
  include_filtered_events: true       # Include filtered-out events in report
  events_per_page_pdf: 3              # Number of events per page in PDF report

advanced:
  min_track_length: 3                 # Minimum number of frames for valid trajectory (filter short tracks)
  track_gap_threshold: 4              # Maximum allowed gap in frames between trajectory segments
  merge_same_frame_objects: true      # Merge duplicate detections in the same frame
  merge_distance_threshold_px: 100    # Distance threshold for merging objects (pixels)
