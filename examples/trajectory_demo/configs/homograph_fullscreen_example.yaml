# 碰撞检测管道 - 示例配置文件
# 文件名: homograph_fullscreen_example.yaml
# 运行命令: cd /workspace/ultralytics && python examples/trajectory_demo/collision_detection_pipeline_yolo_first_method_a.py --config examples/trajectory_demo/configs/homograph_fullscreen_example.yaml

video:
  path: "/workspace/ultralytics/videos/Homograph_Teset_FullScreen.mp4"
  description: "Homograph全屏测试视频"
  fps: 30

yolo:
  model: "yolo11m"
  confidence_threshold: 0.45
  skip_frames: 3

homography:
  enabled: true
  
  # 使用预先计算的homography矩阵文件
  matrix_file: "/workspace/ultralytics/calibration/Homograph_Teset_FullScreen_homography.json"
  
  # 如果想从标注点计算，注释掉matrix_file并取消注释下面的calibration_points
  # calibration_points:
  #   - name: "近处左侧"
  #     pixel: [100, 500]
  #     world: [0.5, 2.0]
  #   - name: "近处右侧"
  #     pixel: [1180, 500]
  #     world: [5.0, 2.0]
  #   - name: "远处左侧"
  #     pixel: [300, 200]
  #     world: [0.5, 10.0]
  #   - name: "远处右侧"
  #     pixel: [980, 200]
  #     world: [5.0, 10.0]

collision:
  proximity_threshold_m: 4.5
  anchor_distance_threshold_m: 1.0
  vertex_shrink: 0.75

ttc_pet:
  ttc_thresholds:
    rear_end_serious: 2.8
    rear_end_general: 4.7
    sideswipe_serious: 2.3
    sideswipe_general: 4.2
  safety_margin_m: 1.5

output:
  save_yolo_detection: true
  save_keyframes: true
  generate_pdf: true
  save_json: true

report:
  max_events_in_report: 10
  include_filtered_events: true
  events_per_page_pdf: 3

advanced:
  min_track_length: 3
  track_gap_threshold: 4
  merge_same_frame_objects: true
  merge_distance_threshold_px: 100
