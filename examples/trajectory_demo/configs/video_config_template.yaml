# Collision Detection Pipeline - Video Configuration File Template
# Use this file to configure parameters for different videos, including Homography calibration points

# Video basic information
video:
  # Video file path
  path: "videos/your_video.mp4"
  
  # Video description
  description: "Test video description"
  
  # Video resolution (optional, validated if specified)
  resolution:
    width: 1280
    height: 720
  
  # Video frame rate (optional, used for time calculations)
  fps: 30

# YOLO detection parameters
yolo:
  # YOLO model variant (yolo11n, yolo11m, yolo11l, yolo11x)
  model: "yolo11m"
  
  # Confidence threshold (0-1, lower = more detections)
  confidence_threshold: 0.45
  
  # Frame skip factor (process every Nth frame, higher = faster but may miss events)
  skip_frames: 3

# Homography calibration information
homography:
  # Enable/disable Homography transformation
  enabled: true
  
  # Homography matrix file path (if empty, compute from calibration points)
  # matrix_file: "calibration/your_video_homography.json"
  
  # Calibration points method: map pixel coordinates to world coordinates
  # Requires at least 4 point pairs to compute Homography matrix
  calibration_points:
    # Each point contains: pixel coordinates (x, y) and world coordinates (x_m, y_m in meters)
    # Example: point 5 meters from camera on ground, appearing at (640, 400) in image
    - name: "Near left corner"
      pixel: [100, 500]        # Image coordinates
      world: [0.5, 2.0]        # World coordinates (unit: meters)
    
    - name: "Near right corner"
      pixel: [1180, 500]
      world: [5.0, 2.0]
    
    - name: "Far left corner"
      pixel: [300, 200]
      world: [0.5, 10.0]
    
    - name: "Far right corner"
      pixel: [980, 200]
      world: [5.0, 10.0]
    
    # Can add more points for better accuracy
    # - name: "Center point"
    #   pixel: [640, 350]
    #   world: [2.75, 6.0]

# Collision detection parameters
collision:
  # Distance threshold for proximity events (unit: meters)
  proximity_threshold_m: 4.5
  
  # Multi-anchor point distance filter threshold (unit: meters, keep only <= this value)
  anchor_distance_threshold_m: 1.0
  
  # Anchor point vertex shrink factor (0-1, smaller = closer to object center)
  # 0.75 = 3/4 distance from center
  vertex_shrink: 0.75

# TTC and PET parameters
ttc_pet:
  # TTC severity thresholds (unit: seconds)
  ttc_thresholds:
    rear_end_serious: 2.8       # Rear-end serious collision: 0-2.8s
    rear_end_general: 4.7       # Rear-end general collision: 2.8-4.7s
    sideswipe_serious: 2.3      # Sideswipe serious collision: 0-2.3s
    sideswipe_general: 4.2      # Sideswipe general collision: 2.3-4.2s
  
  # PET parameters
  safety_margin_m: 1.5          # Safety margin for PET calculation (virtual collision zone)

# Output configuration
output:
  # Generate YOLO detection visualization images
  save_yolo_detection: true
  
  # Generate keyframe images with collision events
  save_keyframes: true
  
  # Generate PDF report (includes images)
  generate_pdf: true
  
  # Generate JSON data files
  save_json: true
  
  # Output directory (relative or absolute path)
  # If empty, use default results/datetime directory
  # output_dir: "results/my_custom_output"

# Report configuration
report:
  # Maximum number of events to display in report
  max_events_in_report: 10
  
  # Include filtered-out events in report
  include_filtered_events: true
  
  # Number of events per page in PDF report
  events_per_page_pdf: 3

# Advanced parameters (optional)
advanced:
  # Trajectory continuity filter (minimum track length in frames)
  min_track_length: 3
  
  # Trajectory gap detection threshold (unit: frames)
  track_gap_threshold: 4
  
  # Enable/disable same-frame object merging
  merge_same_frame_objects: true
  
  # Same-frame object merge distance threshold (unit: pixels)
  merge_distance_threshold_px: 100
